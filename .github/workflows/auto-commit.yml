name: Run Script and Push Changes
permissions:
  contents: write
  pages: write
  id-token: write

on:
  push:
    branches:
      - main

jobs:
  run-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gitPython

      - name: Run update blog
        run: |
          python create_config_and_indexs.py

      - name: Commit changes
        run: | 
          git config --local user.email "formatjn2019@gmail.com"
          git config --local user.name "formatjn2019"
          git add .
          git commit -m "Run autodo.sh and update changes" || echo "No changes to commit"
          git push origin HEAD:doc --force

      - name: Run VuePress in Docker
        run: |
          docker run --rm \
            -v $(pwd)/markdown:/blog/docs \
            -v $(pwd)/package.json:/blog/package.json \
            -v $(pwd)/docs:/blog/docs/.vuepress/dist \
            formatjn2019/vuepress-blog npm run docs:build

      - name: Commit changes
        run: |
          git config --local user.email "formatjn2019@gmail.com"
          git config --local user.name "formatjn2019"
          git add .
          git commit -m "add build file"
          git push origin HEAD:gh-pages --force